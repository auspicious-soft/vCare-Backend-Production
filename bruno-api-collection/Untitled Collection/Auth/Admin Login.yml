info:
  name: Admin Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}admin-login"
  body:
    type: json
    data: |-
      {
        "email": "ankit@auspicioussoft.in",
        "password": "12345678"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const token = res.getBody().data.accessToken
        console.log(token)
        bru.setEnvVar("TOKEN_ADMIN", token)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

