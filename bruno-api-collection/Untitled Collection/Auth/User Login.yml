info:
  name: User Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{URL}}user-login"
  body:
    type: json
    data: |-
      {
          "email": "ankit123@yopmail.com",
          "password": "12345678",
          "fcmToken": "My-New-FCM"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const token = res.getBody().data.accessToken
        console.log(token)
        bru.setEnvVar("TOKEN_USER", token)

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

